[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# A GitHub repo to push Homebrew formulas to
tap = "rayoplateado/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Build every platform on pull requests, not just plan: catches Windows/Linux breakage before a tag
pr-run-mode = "upload"
# release.yml has a hand-added paths filter so landing-only PRs don't build jurl
allow-dirty = ["ci"]
# Runs before `dist build` on every runner: wreq (the browser-fingerprint retry) needs Rust 1.98, and the macOS 14 image has 1.96
github-build-setup = "../build-setup.yml"

# The browser-fingerprint retry links BoringSSL (btls-sys), which is built with cmake and bindgen (libclang) on every
# target, and with NASM on Windows x86_64, where the runner image has none
[dist.dependencies.apt]
cmake = "*"
libclang-dev = "*"

[dist.dependencies.chocolatey]
nasm = "*"
