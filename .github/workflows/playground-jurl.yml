# When a jurl release finishes, point the jurl.dev playground at it and
# deploy. The version stays pinned (with its SHA-256) in
# worker/container/Dockerfile, so git always says which jurl is live.
#
# The commit below is pushed with GITHUB_TOKEN, which doesn't trigger
# site.yml, so this workflow deploys by itself.
name: Playground jurl
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to run in the playground, e.g. v0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  bump:
    # Only finished tag releases, not PR builds or prereleases (v1.2.3-rc.1).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v') &&
       !contains(github.event.workflow_run.head_branch, '-'))
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Point the Dockerfile at the release
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'jurl-x86_64-unknown-linux-gnu.tar.xz.sha256' --dir "$RUNNER_TEMP"
          sha=$(cut -d' ' -f1 "$RUNNER_TEMP/jurl-x86_64-unknown-linux-gnu.tar.xz.sha256")
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "bad checksum: $sha"; exit 1; }
          sed -i -E "s/^ARG JURL_VERSION=.*/ARG JURL_VERSION=$TAG/; s/^ARG JURL_SHA256=.*/ARG JURL_SHA256=$sha/" worker/container/Dockerfile
          git diff
      - name: Commit to main
        run: |
          if git diff --quiet; then echo "Playground already runs $TAG"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Playground: run jurl $TAG"
          git push origin HEAD:main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          wranglerVersion: "4.147.0"
          command: deploy
